[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "filetag-protocol"
dynamic = ["version"]
description = "filetag: job and result format between controller and worker (standard library only)."
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Peter Wein" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Environment :: Console",
]
dependencies = []

[tool.setuptools.dynamic]
version = { attr = "filetag_protocol.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

