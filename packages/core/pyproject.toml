[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "filetag-core"
dynamic = ["version"]
description = "filetag: controller - scan, queue, database, language rules, flat view."
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Peter Wein" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Environment :: Console",
]
dependencies = ["filetag-protocol"]

[project.scripts]
filetag = "filetag_core.cli:main"

[tool.setuptools.dynamic]
version = { attr = "filetag_core.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

